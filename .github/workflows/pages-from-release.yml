name: Deploy Pages from Release

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 绑定 github-pages environment：让主页 Environments 区块显示每次部署状态（成功/失败+URL）。
    # ⚠️ 前提：仓库 Settings → Environments → github-pages → Deployment branches 放行 tags（选 All branches and tags
    #    或添加 refs/tags/*）；否则 tag 触发的 run 会被环境保护规则拒绝（曾踩坑：默认仅放行默认分支）。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        run: |
          curl -fsSL -o index.html "https://github.com/${{ github.repository }}/releases/latest/download/index.html"
          curl -fsSL -o collect.js "https://github.com/${{ github.repository }}/releases/latest/download/collect.js"
          ls -lh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
