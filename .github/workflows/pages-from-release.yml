name: Deploy Pages from Release

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        run: |
          curl -fsSL -o index.html "https://github.com/${{ github.repository }}/releases/latest/download/index.html"
          curl -fsSL -o collect.js "https://github.com/${{ github.repository }}/releases/latest/download/collect.js"
          ls -lh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
